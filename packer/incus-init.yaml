storage_pools:
- name: default
  driver: zfs
  config:
    source: /dev/sdb
networks:
- name: incusbr0
  type: bridge
  config:
    bridge.driver: openvswitch
    ipv4.address: auto
    ipv4.nat: "true"
    ipv6.address: none
profiles:
- name: default
  devices:
    eth0:
      name: eth0
      network: incusbr0
      type: nic
    root:
      path: /
      pool: default
      type: disk